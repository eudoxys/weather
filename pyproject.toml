[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# list every file pattern the package reads at run time
weather = ["*.py"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "weather"
version = "0.0.0" # 0.0.0 = unreleased (hidden by `epm index`)
description = "US weather data"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = ">= 3.11" # must match the CI python versions
keywords = ["eudoxys","github","python","US","weather"] # "eudoxys" marks an official Eudoxys release
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/weather"
Documentation = "https://www.eudoxys.com/weather"
Repository = "https://github.com/eudoxys/weather.git"
Issues = "https://github.com/eudoxys/weather/issues"

[project.scripts]
weather = "weather.cli:main"

[tool.pytest.ini_options]
testpaths = ["weather/_test"]
markers = [
    "network: downloads external data (slow on an empty cache)",
    "live: accesses the NSRDB over the network (requires NSRDB credentials)",
    ]
