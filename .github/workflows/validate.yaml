name: Validation

# Run only when code, test data, or dependencies change
on:
  push:
    branches: [ main ]
    paths: &paths
      - "weather/**"
      - "!weather/_explore/**"
      - "!weather/_review/**"
      - "!weather/_validate/**"
      - "!**/*.md"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/validate.yaml"
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # hard stop on a hung download

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"] # must satisfy requires-python

    env:
      MPLBACKEND: Agg
      # no data cache is restored: every test runs offline against a
      # temporary cache folder (see weather/_test/README.md)

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest pylint   # non-editable: catches missing package-data

    - name: Analyse code
      run: |
        cd weather
        pylint --fail-under 0 *.py

    - name: Run tests
      # the live NSRDB test skips itself: no credentials are installed here
      run: |
        python -m pytest -ra --durations=10
